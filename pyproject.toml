[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaserver"
version = "1.2.0"
requires-python = ">=3.11"
authors = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
maintainers = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
description = "A Flask web application for browsing and playing a media library."
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
  "moongas", 
  "mediascan", 
  "music",
  "metadata",
  "database",
  "python",
  "audio",
  "media",
  "tagging",
  "file management",
  "file organization"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "Flask>=3.1.3",
  "mediascan @ git+https://github.com/bretttolbert/moongas-py-mediascan.git",
  "dataclass-wizard>=0.39.1",
  "numpy>=2.2.6; python_version < '3.12'",
  "numpy>=2.5.3; python_version >= '3.12'",
  "pandas>=2.3.2; python_version < '3.12'",
  "pandas>=3.0.5; python_version >= '3.12'",
  "pyaml>=25.7.0",
  "PyYAML>=6.0.3",
  "SQLAlchemy>=2.0.46",
]

[project.scripts]
mediaserver = "run:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.1.0",
  "pytest>=9.1.1",
]
stats = [
  "scikit-learn>=1.7.2",
]

[project.urls]
"Homepage" = "https://github.com/bretttolbert/moongas-py-mediaserver"
Documentation = "https://github.com/bretttolbert/moongas-py-mediaserver"
Repository = "https://github.com/bretttolbert/moongas-py-mediaserver.git"
"Bug Tracker" = "https://github.com/bretttolbert/moongas-py-mediaserver/issues"
Changelog = "https://github.com/bretttolbert/moongas-py-mediaserver/blob/master/CHANGELOG.md"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.package-data]
app = ['py.typed', "templates/*", "static/**/*"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["app*", "mediaserver*", "scripts"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "tests"
]
norecursedirs = [
  ".env*",
  ".venv*",
  ".git",
  ".tox",
  "build",
  "dist",
  "env*",
  "venv*",
  "docs",
  "__pycache__",
  "scripts",
  "out"
]
addopts = [
  "--ignore=.git",
  "--ignore=.tox",
  "--ignore=build",
  "--ignore=dist",
  "--ignore=__pycache__",
  "--ignore=scripts",
  "--ignore=out"
]

[tool.ruff]
# Set the maximum line length to match your GitHub Actions setup
line-length = 127

[tool.ruff.lint]
# Enable Flake8 syntax/error equivalents (E9, F63, F7, F82)
# "E" and "F" enable pycodestyle errors and Pyflakes
select = ["E9", "F63", "F7", "F82"]

# Enable McCabe complexity checking (equivalent to flake8 --max-complexity=10)
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
mypy_path = "typings"

[[tool.mypy.overrides]]
module = "*.pyi"
ignore_errors = true
